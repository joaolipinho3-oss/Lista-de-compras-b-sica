<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>Lista de compras</title>
  </head>
  <body>
    <header id="cabeçalho">
      <button id="dark-mode-button">🌒</button>
      <h1>LISTA DE COMPRAS</h1>
      <a id="github-link">🐱</a>
    </header>
    <main id="layout">
      <section class="lista">
        <h1>Bem vindo a nossa lista!!</h1>
        <h2 id="label-input">Digite abaixo os items que deseja compra:</h2>
        <div id="inputs-lista">
          <input
            type="text"
            placeholder="Digite aqui os itens:"
            id="input-text"
          />
          <button id="botão-enviar">+</button>
        </div>
      </section>
      <section class="lista">
        <h2>📝SUA LISTA🛍️</h2>
        <div id="output-produtos">
          <ul id="molde-lista" style="text-decoration: none"></ul>
        </div>
      </section>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
