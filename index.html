<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /*---CORES ROOT e GERAL CONFIG---*/
      :root {
        --cor-background: #e7d2e2;
        --cor-cabeçalho: #ddbfd6;
        --sombra-cabeçalho: #cf90c0;
        --fonte-geral: "Open Sans", sans-serif;
        --cor-fonte: #000080de;
        --fonte-sombra:#0000805e;
        --lista-background-color: #faebd7;
        --itens-background-color: white;
        --cor-borda: var(--cor-fonte);
      }
      * {
        margin: auto;
        padding: 0;
      }
      body {
        font-family: var(--fonte-geral);
        background-attachment: fixed;
        background-color: var(--cor-background);
        color: var(--cor-fonte);
      }
      header {
        display: flex;
        padding: 10px;
        margin-bottom: 50px;
      }
      main {
        display: block;
        margin: 25px;
      }
      /*---CABEÇALHO CONFIG---*/
      #cabeçalho {
        background-color: var(--cor-cabeçalho);
      }
      #cabeçalho:hover {
        box-shadow: 0px 5px 10px var(--sombra-cabeçalho);
        transition: 300ms;
      }

      #dark-mode-button{
        border: none;
        background-color: rgba(0, 0, 0, 0);
        font-size: 24px;
      }

    #github-link {
        font-size: 24px;
    }

      #github-link:hover {
        cursor: pointer;
        text-shadow: 2px 3px 5px var(--fonte-sombra);
        transition: 500ms;
      }

      #dark-mode-button:hover{
        cursor: pointer;
        text-shadow: 2px 3px 5px var(--fonte-sombra);
        transition: 500ms;
      }

      .lista{
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #label-input:hover {
        text-shadow: 0px 2px 1px var(--fonte-sombra);
        transition: 500ms;
      }
      #input-text{
        padding: 10px ;
        background-attachment: fixed;
        border: 2px solid var(--cor-borda);
        border-radius: 16px;
      }

      #botão-enviar{
        padding-right: 5px ;
        padding-left: 5px;
        border: 2px solid var(--cor-borda);
        border-radius: 10px;
        font-size: 24px;
        color: white;
        background-color: var(--cor-fonte);
      }

      #botão-enviar:hover {
        cursor: pointer;
        transform: scale();
        text-shadow: 2px 3px 5px var(--fonte-sombra);
        transition: 500ms;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>Lista de compras</title>
  </head>
  <body>
    <header id="cabeçalho">
      <button id="dark-mode-button">🌒</button>
      <h1>LISTA DE COMPRAS</h1>
      <a id="github-link">🐱</a>
    </header>
    <main id="layout">
      <section class="lista">
        <h1>Bem vindo a nossa lista!! </h1>
        <h2 id="label-input">Digite abaixo os items que deseja compra:</h2>
        <div id="inputs-lista">
        <input type="text" placeholder="Digite aqui os itens:" id="input-text"/>
        <button id="botão-enviar">+</button> </div>
      </section>
      <section class="lista">
        <div id="output-produtos">
          <ul id="molde-lista" style="text-decoration: none">
            <li class="itens" style="list-style: none"></li>
            <li class="itens" style="list-style: none"></li>
            <li class="itens" style="list-style: none"></li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
